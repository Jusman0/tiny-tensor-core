name: tests

on: [push, pull_request]

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog and NumPy
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          python3 -m pip install numpy
      - name: All 10,000 MNIST images, bit-exact against the golden model
        run: make test-full
